<style>
:root{--asphalt:#1f2a33;--paper:#f5f6f3;--card:#fff;--line:#d9ddd6;--hivis:#f2c200;--ok:#1e8e5a;--ok-bg:#e2f4ea;--muted:#5d6872}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--asphalt:#f1f3ef;--paper:#171d22;--card:#212a31;--line:#35414a;--ok:#4cc58b;--ok-bg:#16382a;--muted:#a2adb6}}
:root[data-theme="dark"]{--asphalt:#f1f3ef;--paper:#171d22;--card:#212a31;--line:#35414a;--ok:#4cc58b;--ok-bg:#16382a;--muted:#a2adb6}
*{box-sizing:border-box}
html,body{margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--paper);color:var(--asphalt);line-height:1.7;font-size:17px}
main{max-width:820px;margin:0 auto;padding:18px 14px 64px}
h1{font-size:1.7rem;margin:.1em 0 .2em}
.stripe{height:8px;border-radius:4px;margin-bottom:16px;background:repeating-linear-gradient(-45deg,var(--hivis) 0 14px,var(--asphalt) 14px 28px)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button{font:inherit;color:inherit;cursor:pointer}
.tab{background:transparent;border:2px solid var(--line);border-radius:10px;padding:5px 16px;font-weight:500}
.tab.on{background:var(--hivis);color:#1f2a33;border-color:#1f2a33;font-weight:700}
:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
input[type=search]{font:inherit;width:100%;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--asphalt)}
.item{display:grid;grid-template-columns:3.2em 1fr;gap:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.n{color:var(--muted);font-size:.85rem;padding-top:.15em}
.q{font-weight:500}
.a{grid-column:2;background:var(--ok-bg);border-inline-start:4px solid var(--ok);border-radius:6px;padding:3px 10px}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sign{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sign img{display:block;margin:0 auto 6px;max-width:100%;height:84px;object-fit:contain;background:#fff;border-radius:8px}
.sign .a{display:block;grid-column:auto;text-align:start}
.sign .n{margin-top:4px}
.hide{display:none!important}
@media print{.tabs,input,.stripe,.noprint{display:none!important}.item,.sign{break-inside:avoid}body{background:#fff;color:#000}.panel.hide{display:block!important}}
</style>
</head>

<div class="stripe" aria-hidden="true"></div>
<h1>ملخص الأسئلة والأجوبة</h1>
<p class="muted small">كل سؤال نصي مختصر مع الجواب الصحيح. الأرقام هي رقم السؤال في الاختبار الأصلي. أسئلة الصور (إشارات المرور) مشتركة بين الاختبارين وتجدها في تبويب خاص.</p>
<div class="tabs" role="tablist">
  <button class="tab on" data-t="bike">الدراجات الآلية (<span id="nb"></span>)</button>
  <button class="tab" data-t="car">السيارة (<span id="nc"></span>)</button>
  <button class="tab" data-t="signs">الإشارات المشتركة (<span id="ns"></span>)</button>
  <button class="tab noprint" id="pr">طباعة / PDF</button>
</div>
<input type="search" id="q" placeholder="ابحث في الأسئلة والأجوبة…" aria-label="بحث">
<p class="muted small" id="cnt"></p>
<div id="p-bike" class="panel"></div>
<div id="p-car" class="panel hide"></div>
<div id="p-signs" class="panel signs hide"></div>
</main>

const $=id=>document.getElementById(id);
const nz=s=>s.toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
let tab="bike";
$("nb").textContent=DATA.bike.length;$("nc").textContent=DATA.car.length;$("ns").textContent=DATA.signs.length;
function item(i,q,a){const d=document.createElement("div");d.className="item";
  const n=document.createElement("div");n.className="n";n.textContent="#"+i;
  const t=document.createElement("div");t.className="q";t.textContent=q;
  const r=document.createElement("div");r.className="a";r.textContent="✓ "+a;d.append(n,t,r);d.dataset.s=nz(q+" "+a);return d}
DATA.bike.forEach(([i,q,a])=>$("p-bike").appendChild(item(i,q,a)));
DATA.car.forEach(([i,q,a])=>$("p-car").appendChild(item(i,q,a)));
DATA.signs.forEach(s=>{const d=document.createElement("div");d.className="sign";
  const im=document.createElement("img");im.src=s.img;im.alt="";
  const a=document.createElement("div");a.className="a";a.textContent="✓ "+s.a;
  const n=document.createElement("div");n.className="n";n.textContent="دراجات #"+s.b+(s.c?" · سيارة #"+s.c:"");
  d.append(im,a,n);d.dataset.s=nz(s.a);$("p-signs").appendChild(d)});
function apply(){
  const s=nz($("q").value.trim());let shown=0;
  const box=$("p-"+tab);
  [...box.children].forEach(c=>{const ok=!s||c.dataset.s.includes(s);c.classList.toggle("hide",!ok);if(ok)shown++});
  $("cnt").textContent=s?`${shown} نتيجة`:"";
}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));
  ["bike","car","signs"].forEach(k=>$("p-"+k).classList.toggle("hide",k!==tab));apply()});
$("q").oninput=apply;$("pr").onclick=()=>window.print();
</script>
